name: Release

# Releases are started by hand from the Actions tab: pick the branch, pick
# which part of x.y.z to raise. Nothing here runs on push.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of x.y.z to raise
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release commit and its tag
      id-token: write # mint the OIDC token npm trades for publish rights
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # A dirty tree stops npm version here, before anything is published.
      - name: Raise the version and tag it
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "$BUMP" -m "Release v%s"

      # No NODE_AUTH_TOKEN: the OIDC token above is what proves who we are, and
      # it also gets the tarball its provenance attestation.
      - run: npm publish

      # Last, so a failed publish leaves no tag behind pointing at nothing.
      - name: Push the release commit and tag
        run: git push --follow-tags
